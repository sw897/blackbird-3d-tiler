name: Blackbird CI

on:
  push:
    branches:
      - blackbird-3d-tiler
  pull_request:
    branches:
      - blackbird-3d-tiler
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and run tests
        run: ./gradlew --no-daemon --console=plain --stacktrace --init-script .github/ci/verification.init.gradle clean build

      - name: Smoke-test executable JAR
        run: |
          java -jar mago-tiler/dist/mago-3d-tiler-*.jar --help | tee build/jar-help.log
          grep -q '^Usage:' build/jar-help.log

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/*.xml
            build/jar-help.log
          if-no-files-found: ignore
          retention-days: 7
